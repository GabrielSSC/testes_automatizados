<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Catálogo</title><link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body><main class="auth-container">
  <div class="brand">Ada Tech · Testes Automatizados I</div>
  <h1>Entrar no catálogo</h1>
  <p>Use uma conta de demonstração para acessar os recursos protegidos.</p>
  <p th:if="${param.error}" class="error" id="login-erro">Usuário ou senha inválidos.</p>
  <p th:if="${param.logout}" class="success">Sessão encerrada.</p>
  <form th:action="@{/login}" method="post" id="form-login">
    <label for="username">Usuário</label><input id="username" name="username" required autocomplete="username">
    <label for="password">Senha</label><input id="password" type="password" name="password" required autocomplete="current-password">
    <button type="submit" id="btn-login">Entrar</button>
  </form>
  <a th:href="@{/produtos}">Voltar ao catálogo público</a>
</main></body></html>
