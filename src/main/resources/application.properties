server.port=9091
spring.application.name=catalogo-testes
catalogo.nome=Catálogo API - Spring Boot
catalogo.estoque.url=${ESTOQUE_LOCAL_URL:http://localhost:8081}
spring.datasource.url=jdbc:h2:file:./data/catalogo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,catalogoReadiness
management.info.env.enabled=true
info.app.nome=${catalogo.nome}
